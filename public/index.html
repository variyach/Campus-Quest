<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Quest: The University Life</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f2ec;color:#25232b}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e0d7;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 8px 30px #0000000a}h1{font-size:clamp(40px,7vw,72px);line-height:.92;margin:8px 0}h2{margin:6px 0 12px}h3{margin:4px 0 8px}.muted{color:#777}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:#6d5dfc}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:750;cursor:pointer}.primary{background:#6d5dfc;color:#fff}.soft{background:#eeeaff;color:#5146c7}.ghost{background:#fff;border:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.optiongrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{padding:16px;border:1px solid #ddd7ce;border-radius:15px;background:#fff;text-align:left;cursor:pointer}.option:hover,.option.selected{border:2px solid #6d5dfc;background:#f3f0ff}.stat{padding:15px;border:1px solid #eee8df;border-radius:15px;background:#faf9f6}.stat b{display:block;font-size:24px;margin-top:4px}.bar{height:7px;background:#e9e5de;border-radius:8px;margin-top:8px}.fill{height:100%;background:#6d5dfc;border-radius:8px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{padding:15px;border:1px solid #ddd7ce;border-radius:14px;background:#fff;text-align:left;cursor:pointer}.action:hover{border-color:#6d5dfc}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{padding:12px;border:1px solid #d8d2c9;border-radius:10px;font:inherit}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eeeaff;color:#5146c7;font-size:12px;font-weight:700}.event{background:#f0edff;border-radius:15px;padding:17px}.choice{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid #d8d1ff;background:#fff;border-radius:10px;text-align:left;cursor:pointer}.toast{position:fixed;right:18px;bottom:18px;background:#242229;color:#fff;padding:12px 16px;border-radius:11px}.hero{min-height:75vh;display:flex;align-items:center}.small{font-size:13px}@media(max-width:700px){.grid,.optiongrid,.actions,.two{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body><main class="wrap" id="app"></main><div id="toast"></div>
<script>
const app=document.getElementById('app');
const programs=[
{name:'BSBA Financial Management',college:'College of Business',years:4,skills:['Finance','Accounting','Economics','Analysis'],courses:['Fundamentals of Accounting','Business Finance','Money and Banking','Financial Markets','Investment Analysis','Risk Management']},
{name:'BS Accountancy',college:'College of Business',years:4,skills:['Accounting','Auditing','Taxation','Analysis'],courses:['Financial Accounting','Management Accounting','Income Taxation','Auditing','Accounting Information Systems','Business Law']},
{name:'BSBA Marketing Management',college:'College of Business',years:4,skills:['Marketing','Communication','Research','Creativity'],courses:['Principles of Marketing','Consumer Behavior','Market Research','Digital Marketing','Sales Management','Strategic Marketing']},
{name:'BS Computer Science',college:'College of Computing',years:4,skills:['Programming','Algorithms','Mathematics','Problem Solving'],courses:['Programming','Data Structures','Algorithms','Database Systems','Operating Systems','Software Engineering']},
{name:'BS Information Technology',college:'College of Computing',years:4,skills:['Technology','Programming','Networks','Systems'],courses:['Programming Fundamentals','Database Management','Networking','Web Development','Systems Administration','IT Project Management']},
{name:'BS Civil Engineering',college:'College of Engineering',years:4,skills:['Mathematics','Design','Engineering','Problem Solving'],courses:['Engineering Drawing','Calculus','Physics','Strength of Materials','Structural Analysis','Engineering Design']},
{name:'BS Nursing',college:'College of Health Sciences',years:4,skills:['Clinical Knowledge','Patient Care','Communication','Medical Knowledge'],courses:['Anatomy and Physiology','Nursing Fundamentals','Pharmacology','Medical-Surgical Nursing','Community Health Nursing','Clinical Practicum']},
{name:'BS Psychology',college:'College of Arts and Sciences',years:4,skills:['Psychology','Research','Communication','Analysis'],courses:['General Psychology','Developmental Psychology','Abnormal Psychology','Research Methods','Social Psychology','Psychological Assessment']},
{name:'BA Communication',college:'College of Arts and Sciences',years:4,skills:['Writing','Media','Communication','Creativity'],courses:['Purposive Communication','Media Studies','Writing for Media','Communication Theory','Broadcasting','Communication Research']},
{name:'BS Biology',college:'College of Arts and Sciences',years:4,skills:['Biology','Research','Laboratory','Science'],courses:['General Biology','Cell Biology','Genetics','Ecology','Biochemistry','Laboratory Research']},
{name:'BS Hospitality Management',college:'College of Hospitality and Tourism',years:4,skills:['Hospitality','Management','Service','Communication'],courses:['Hospitality Operations','Food and Beverage Service','Housekeeping Management','Tourism Fundamentals','Events Management','Hospitality Marketing']}
];
const universities=[
{name:'Eastern Valley State University',type:'Public',desc:'Affordable public university with a large, active campus.',tuition:'Lower',feature:'Student organizations'},
{name:'Metro Central University',type:'Private',desc:'Urban private university with industry-focused opportunities.',tuition:'Higher',feature:'Career connections'},
{name:'St. Aurelia University',type:'Private',desc:'Private university with smaller classes and a strong campus community.',tuition:'Higher',feature:'Student support'}
];
const genEd=['Understanding the Self','Purposive Communication','Mathematics in the Modern World','Readings in Philippine History','The Contemporary World','Science, Technology and Society','Ethics','Art Appreciation','Physical Education'];
let state={started:false,name:'',age:18,pronouns:'She/Her',background:'Middle-income',personality:'Calm',university:null,program:null,year:1,semester:1,week:1,day:1,money:1500,energy:82,morale:72,stress:24,reputation:40,gpa:0,skills:{},courses:{},friends:{},log:[],event:null};
const events=[
['A Classmate Needs Help','A classmate from your program asks to study together.',[['Study together',5,7,-8],['Wish them luck',0,2,-2],['Say you are busy',-3,0,1]]],
['Surprise Quiz','Your professor announces a short quiz today.',[['Review before class',0,5,-8],['Take it without reviewing',0,1,-3],['Skip class',-4,0,2]]],
['Organization Fair','Student organizations are recruiting new members.',[['Join a program organization',4,0,-6],['Join a hobby club',2,3,-7],['Rest instead',0,5,2]]],
['Group Project','Your group needs someone to coordinate the project.',[['Volunteer',5,3,-8],['Help quietly',2,2,-5],['Decline',-2,0,0]]],
['Career Talk','A company is holding a career talk on campus.',[['Attend',3,2,-5],['Study instead',0,4,-6],['Skip',0,0,4]]],
['Family Message','Your family checks in during a busy week.',[['Call them',2,3,-3],['Reply later',0,0,0],['Ignore for now',-2,0,1]]]
];
function saveLocal(){localStorage.setItem('campusQuestState',JSON.stringify(state));toast('Game saved');}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem('campusQuestState'));if(x){state=x;return true}}catch(e){}return false}
function toast(x){document.getElementById('toast').textContent=x;setTimeout(()=>document.getElementById('toast').textContent='',1600)}
function stat(label,value,max=100){let v=Math.max(0,Math.min(max,Number(value)));return '<div class="stat"><span class="muted">'+label+'</span><b>'+Math.round(v)+'</b><div class="bar"><div class="fill" style="width:'+v/max*100+'%"></div></div></div>'}
function home(){app.innerHTML='<section class="hero"><div><div class="eyebrow">UNIVERSITY LIFE SIMULATION</div><h1>Campus Quest</h1><h2>The University Life</h2><p class="muted">Choose your university. Choose your degree. Build your own university story.</p><button class="btn primary" onclick="create()">Start New Game →</button> <button class="btn soft" onclick="continueGame()">Continue</button><div class="card"><b>Phase 1</b><p class="muted">Student Mode prototype: character creation, university and program selection, curriculum, daily life, stats, events and local saves.</p></div></div></section>'}
function create(){state={...state,started:false,university:null,program:null,year:1,semester:1,week:1,day:1,money:1500,energy:82,morale:72,stress:24,reputation:40,gpa:0,skills:{},courses:{},friends:{},log:[],event:null};stepCharacter()}
function stepCharacter(){app.innerHTML='<div class="card"><div class="eyebrow">STEP 1 OF 3</div><h1>Create Your Student</h1><div class="field"><label>Name</label><input id="nm" placeholder="Your character name"></div><div class="field"><label>Age</label><input id="age" type="number" value="18" min="16" max="40"></div><div class="field"><label>Pronouns</label><select id="pro"><option>She/Her</option><option>He/Him</option><option>They/Them</option><option>Other</option></select></div><div class="field"><label>Background</label><select id="bg"><option>Low-income</option><option>Lower-middle income</option><option selected>Middle-income</option><option>Upper-middle income</option><option>Wealthy</option><option>Working student</option><option>Scholarship student</option></select></div><div class="field"><label>Personality</label><select id="per"><option>Calm</option><option>Ambitious</option><option>Introverted</option><option>Extroverted</option><option>Competitive</option><option>Friendly</option><option>Independent</option><option>Disciplined</option><option>Creative</option></select></div><button class="btn primary" onclick="characterNext()">Next: University →</button></div>'}
function characterNext(){state.name=document.getElementById('nm').value.trim()||'Alex';state.age=Number(document.getElementById('age').value)||18;state.pronouns=document.getElementById('pro').value;state.background=document.getElementById('bg').value;state.personality=document.getElementById('per').value;stepUniversity()}
function stepUniversity(){app.innerHTML='<div class="card"><div class="eyebrow">STEP 2 OF 3</div><h1>Choose Your University</h1><p class="muted">Fictional universities with different environments. Their curricula are configurable and do not represent any real institution.</p><div class="optiongrid">'+universities.map((u,i)=>'<button class="option" onclick="pickUni('+i+')"><span class="pill">'+u.type+'</span><h3>'+u.name+'</h3><p>'+u.desc+'</p><small>Tuition: '+u.tuition+' · '+u.feature+'</small></button>').join('')+'</div><p><button class="btn ghost" onclick="stepCharacter()">← Back</button></p></div>'}
function pickUni(i){state.university=universities[i];stepProgram()}
function stepProgram(){app.innerHTML='<div class="card"><div class="eyebrow">STEP 3 OF 3</div><h1>Choose Your Program</h1><p class="muted">Real-world degree programs are represented as game curricula. Course names and sequencing can vary by university.</p><div class="optiongrid">'+programs.map((p,i)=>'<button class="option" onclick="pickProgram('+i+')"><span class="pill">'+p.college+'</span><h3>'+p.name+'</h3><p>'+p.years+' years · '+p.skills.slice(0,3).join(' · ')+'</p><small>'+p.courses.slice(0,3).join(' · ')+'</small></button>').join('')+'</div><p><button class="btn ghost" onclick="stepUniversity()">← Back</button></p></div>'}
function pickProgram(i){state.program=programs[i];state.started=true;state.courses={};state.program.courses.forEach(c=>state.courses[c]=65);state.skills={};state.program.skills.forEach(k=>state.skills[k]=45);state.log=['Orientation day: welcome to '+state.university.name+'.','You enrolled in '+state.program.name+'.'];curriculum()}
function curriculum(){let p=state.program;app.innerHTML='<div class="card"><div class="eyebrow">YOUR ACADEMIC PATH</div><h1>'+p.name+'</h1><p><b>'+state.university.name+'</b> · '+p.college+' · '+p.years+' years</p><div class="two"><div><h3>Representative General Education</h3><p>'+genEd.join(' · ')+'</p><h3>Program Courses</h3><ul>'+p.courses.map(c=>'<li>'+c+'</li>').join('')+'</ul></div><div class="card"><h3>Your Starting Profile</h3><p>Energy 82 · Morale 72 · Stress 24</p><p>Money ₱1,500</p><p>Starting year: 1st Year</p></div></div><button class="btn primary" onclick="begin()">Begin University →</button></div>'}
function begin(){state.log.unshift('First day: you entered campus for the first time.');saveLocal();render()}
function render(){if(!state.started){home();return}let avg=Object.values(state.courses).reduce((a,b)=>a+b,0)/Math.max(1,Object.values(state.courses).length);state.gpa=(avg/25);let day=['Monday','Tuesday','Wednesday','Thursday','Friday'][((state.day-1)%5)];app.innerHTML='<div class="top"><div><div class="eyebrow">CAMPUS QUEST · STUDENT MODE</div><h2>'+state.name+'</h2><span class="pill">'+state.program.name+'</span></div><div><button class="btn soft" onclick="saveLocal()">Save</button> <button class="btn ghost" onclick="home()">Menu</button></div></div><div class="grid">'+stat('⚡ Energy',state.energy)+stat('😊 Morale',state.morale)+stat('🔥 Stress',state.stress)+stat('⭐ Reputation',state.reputation)+stat('📚 Academic Average',avg)+stat('💰 Money',state.money,3000)+'</div><div class="two"><div><div class="card"><div class="top"><div><h2>'+day+' · Week '+state.week+'</h2><p class="muted">Year '+state.year+' · Semester '+state.semester+'</p></div><button class="btn primary" onclick="nextDay()">End Day</button></div><h3>Today\'s Classes</h3><p><b>'+state.program.courses[(state.day-1)%state.program.courses.length]+'</b> · 8:00 AM</p><div class="actions"><button class="action" onclick="act(&quot;class&quot;)"><b>📖 Attend Class</b><br><span class="muted">Learn and build academic progress.</span></button><button class="action" onclick="act(&quot;study&quot;)"><b>📝 Study</b><br><span class="muted">Improve your current course.</span></button><button class="action" onclick="act(&quot;social&quot;)"><b>👥 Socialize</b><br><span class="muted">Build relationships and morale.</span></button><button class="action" onclick="act(&quot;work&quot;)"><b>💼 Part-time Work</b><br><span class="muted">Earn ₱150 but spend energy.</span></button><button class="action" onclick="act(&quot;club&quot;)"><b>🎭 Join Campus Activity</b><br><span class="muted">Build reputation and connections.</span></button><button class="action" onclick="act(&quot;rest&quot;)"><b>🛏️ Rest</b><br><span class="muted">Recover energy and reduce stress.</span></button></div></div>'+eventBox()+'</div><aside><div class="card"><h3>Program Skills</h3>'+Object.entries(state.skills).map(([k,v])=>'<p><b>'+k+'</b> '+Math.round(v)+'</p>').join('')+'</div><div class="card"><h3>University</h3><p><b>'+state.university.name+'</b></p><p class="muted">'+state.university.desc+'</p><h3>Campus Life</h3><p>Library · Cafeteria · Student Center · Gym · Organization Fair</p></div></aside></div><div class="card"><h3>Recent Life</h3>'+state.log.slice(0,10).map(x=>'<p>• '+x+'</p>').join('')+'</div>'}
function eventBox(){if(!state.event)return '<div class="card"><h3>📅 No active event</h3><p class="muted">Continue your day. A new event may appear tomorrow.</p></div>';let e=state.event;return '<div class="card event"><b>EVENT</b><h3>'+e[0]+'</h3><p>'+e[1]+'</p>'+e[2].map((c,i)=>'<button class="choice" onclick="eventChoice(&quot;'+i+'&quot;)">'+c[0]+'</button>').join('')+'</div>'}
function act(type){if(type==='class'){state.energy-=8;state.stress+=4;let c=state.program.courses[(state.day-1)%state.program.courses.length];state.courses[c]=Math.min(100,state.courses[c]+3);state.reputation+=1;state.log.unshift('Attended '+c+'.');}
if(type==='study'){state.energy-=10;state.stress+=6;let c=state.program.courses[(state.day-1)%state.program.courses.length];state.courses[c]=Math.min(100,state.courses[c]+5);state.log.unshift('Studied '+c+' in the library.');}
if(type==='social'){state.energy-=5;state.morale+=7;state.stress-=3;state.reputation+=1;state.friends.Classmate=(state.friends.Classmate||0)+5;state.log.unshift('Spent time with classmates.');}
if(type==='work'){state.energy-=14;state.stress+=7;state.money+=150;state.log.unshift('Worked a part-time shift and earned ₱150.');}
if(type==='club'){state.energy-=7;state.morale+=4;state.reputation+=4;state.log.unshift('Joined a campus activity.');}
if(type==='rest'){state.energy+=18;state.stress-=10;state.morale+=3;state.log.unshift('Took time to rest.');}
state.energy=Math.max(0,Math.min(100,state.energy));state.stress=Math.max(0,Math.min(100,state.stress));state.morale=Math.max(0,Math.min(100,state.morale));state.reputation=Math.max(0,Math.min(100,state.reputation));if(Math.random()<.25)state.event=events[Math.floor(Math.random()*events.length)];saveLocal();render()}
function eventChoice(i){let c=state.event[2][i];state.reputation+=c[1];state.morale+=c[2];state.energy+=c[3];state.log.unshift(state.event[0]+': '+c[0]);state.event=null;saveLocal();render()}
function nextDay(){state.day++;state.energy-=3;if(state.day>5){state.day=1;state.week++;state.money-=250;state.log.unshift('A new university week begins. Weekly living expenses: ₱250.');}
state.energy=Math.max(0,Math.min(100,state.energy));state.stress=Math.max(0,state.stress-3);state.morale=Math.max(0,Math.min(100,state.morale+2));if(state.week%4===0&&state.day===1){state.log.unshift('Midterm season is approaching. Your preparation matters.');state.stress+=6}if(Math.random()<.55)state.event=events[Math.floor(Math.random()*events.length)];saveLocal();render()}
function continueGame(){if(loadLocal()&&state.started){render();toast('Game loaded')}else{create()}}
home();
</script></body></html>
