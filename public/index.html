<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Quest: The Learning Life</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f3ef;color:#252525}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e1da;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 8px 25px #0000000b}h1{font-size:clamp(38px,7vw,72px);line-height:.95;margin:12px 0}.muted{color:#777}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#6d5dfc;color:white}.soft{background:#eeeaff;color:#5146c7}.ghost{background:white;border:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#faf9f6;border:1px solid #eee8df;border-radius:14px;padding:15px}.stat b{display:block;font-size:24px;margin-top:5px}.bar{height:7px;background:#e9e7e3;border-radius:9px;margin-top:8px}.fill{height:100%;background:#6d5dfc;border-radius:9px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{text-align:left;background:#fff;border:1px solid #ddd;border-radius:12px;padding:15px;cursor:pointer}.action:hover{border-color:#6d5dfc}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.auth{max-width:520px;margin:60px auto}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{padding:12px;border:1px solid #ddd;border-radius:10px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.role{padding:16px;border:1px solid #ddd;border-radius:13px;background:white;text-align:left;cursor:pointer}.role.on{border:2px solid #6d5dfc;background:#eeeaff}.toast{position:fixed;right:20px;bottom:20px;background:#222;color:#fff;padding:12px 16px;border-radius:10px}.event{padding:16px;background:#eeeaff;border-radius:12px}.choice{display:block;width:100%;padding:10px;margin-top:8px;text-align:left;border:1px solid #d8d3ff;background:white;border-radius:9px;cursor:pointer}@media(max-width:700px){.grid,.roles{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}}@media(max-width:480px){.grid,.roles{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap" id="app"></main><div id="toast"></div><script>
const app=document.getElementById('app');let me=null,role='Student';window.addEventListener('error',e=>{const z=document.getElementById('err');if(z)z.textContent='Game error: '+e.message;});
let s={started:false,name:'',year:'1st Year',role:'Student',week:1,day:1,money:1250,energy:85,morale:70,stress:25,reputation:40,grades:{Finance:62,Entrepreneurship:66,Accounting:70,Economics:64,Communication:76},relationships:{Anna:25,Marcus:18,Jamie:10},log:[],event:null,teacher:{teaching:55,knowledge:78,management:48,empathy:60,organization:55,communication:62,students:32,average:76,engagement:72,salary:28500}};
const events=[['A Classmate Needs Help','Anna asks to study together.',[['Study with Anna',10,3,-8],['Wish her luck',-2,4,-5],['Say you are busy',-5,2,0]]],['Unexpected Quiz','A professor announces a short quiz.',[['Review notes',0,5,-8],['Take it confidently',0,2,-4],['Ask to take it later',0,0,0]]],['Club Recruitment','Organizations are recruiting at lunch.',[['Business Organization',0,0,-5],['Dance Club',0,0,-7],['Skip and rest',0,0,8]]]];
const api=async(u,o={})=>{let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j};
const toast=x=>{document.getElementById('toast').textContent=x;setTimeout(()=>document.getElementById('toast').textContent='',1800)};
function auth(){app.innerHTML='<div class="card auth"><h1>Campus Quest</h1><p class="muted">The Learning Life</p><h2>Play online</h2><div class="field"><label>Username</label><input id="u" autocomplete="username"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div><div><button class="btn primary" onclick="login()">Log in</button> <button class="btn soft" onclick="register()">Create account</button></div><p id="err" class="muted"></p></div>'}
async function login(){try{let x=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});me=x.user;await loadGame();if(!s.started)setup()}catch(e){err.textContent=e.message}}
async function register(){try{let x=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});me=x.user;setup()}catch(e){err.textContent=e.message}}
function setup(){app.innerHTML='<div class="card"><div class="muted">CAMPUS QUEST</div><h1>Create your life.</h1><p>Choose your role and begin a replayable school story.</p><div class="field"><label>Name</label><input id="name" placeholder="Your character name"></div><div class="field"><label>Year level</label><select id="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div><div class="roles"><button class="role on" onclick="pick(this,'Student')">🎓 Student<br><small>Study, socialize, work and build your future.</small></button><button class="role" onclick="pick(this,'Teacher')">👩‍🏫 Teacher<br><small>Teach classes, mentor students and manage workload.</small></button><button class="role" onclick="pick(this,'Principal')">🏫 Principal<br><small>Coming soon.</small></button></div><button class="btn primary" style="margin-top:18px" onclick="start()">Start Life →</button></div>'}
function pick(el,r){document.querySelectorAll('.role').forEach(x=>x.classList.remove('on'));el.classList.add('on');role=r}
function start(){s.started=true;s.name=document.getElementById('name').value.trim()||'Alex';s.year=document.getElementById('year').value;s.role=role;if(role==='Teacher')s.log.unshift('You reported for your first week as a teacher.');else s.log.unshift('You arrived on campus for your first week.');render();save()}
function pct(x){return Math.max(0,Math.min(100,Math.round(x)))}
function stat(n,x){return '<div class="stat"><span class="muted">'+n+'</span><b>'+Math.round(x)+'</b><div class="bar"><div class="fill" style="width:'+pct(x)+'%"></div></div></div>'}
function render(){if(s.role==='Principal'){app.innerHTML='<div class="card"><h1>Principal Mode</h1><p>Principal Mode is planned for a future update.</p><button class="btn soft" onclick="s.role=\'Student\';render()">Return</button></div>';return}let avg=Math.round(Object.values(s.grades).reduce((a,b)=>a+b,0)/5);let d=['Monday','Tuesday','Wednesday','Thursday','Friday'][(s.day-1)%5];app.innerHTML='<div class="top"><div><div class="muted">CAMPUS QUEST • '+s.role.toUpperCase()+' • WEEK '+s.week+'</div><h2>'+s.name+'</h2></div><div><button class="btn soft" onclick="save()">Save</button> <button class="btn ghost" onclick="logout()">Log out</button></div></div>'+ (s.role==='Teacher'?teacherView():studentView())}
function studentView(){let avg=Math.round(Object.values(s.grades).reduce((a,b)=>a+b,0)/5);return '<div class="grid">'+stat('⚡ Energy',s.energy)+stat('😊 Morale',s.morale)+stat('🔥 Stress',s.stress)+stat('⭐ Reputation',s.reputation)+stat('📚 Average',avg)+stat('💰 Money','₱'+Math.round(s.money))+'</div><div class="card"><div class="top"><h2>'+['Monday','Tuesday','Wednesday','Thursday','Friday'][(s.day-1)%5]+' Schedule</h2><button class="btn soft" onclick="nextDay()">End Day</button></div><p class="muted">Make choices and live with their consequences.</p><div class="actions"><button class="action" onclick="act('class')"><b>📖 Attend class</b><br><span class="muted">Learn and build reputation.</span></button><button class="action" onclick="act('study')"><b>📝 Study</b><br><span class="muted">Improve a subject.</span></button><button class="action" onclick="act('social')"><b>👥 Socialize</b><br><span class="muted">Build relationships.</span></button><button class="action" onclick="act('work')"><b>💼 Work</b><br><span class="muted">Earn ₱150.</span></button><button class="action" onclick="act('club')"><b>🎭 Club</b><br><span class="muted">Morale and reputation.</span></button><button class="action" onclick="act('rest')"><b>🛏️ Rest</b><br><span class="muted">Recover and reduce stress.</span></button></div></div>'+eventBox()+'<div class="card"><h2>Recent Events</h2>'+ (s.log.length?s.log.slice(0,12).map(x=>'<p>'+x+'</p>').join(''):'<p class="muted">No events yet.</p>')+'</div>'}
function teacherView(){let t=s.teacher;return '<div class="grid">'+stat('⚡ Energy',s.energy)+stat('😊 Morale',s.morale)+stat('🔥 Stress',s.stress)+stat('⭐ Reputation',s.reputation)+stat('🎓 Teaching',t.teaching)+stat('📊 Class Average',t.average)+'</div><div class="card"><div class="top"><h2>Teacher Schedule</h2><button class="btn soft" onclick="nextDay()">End Day</button></div><p class="muted">Financial Management • Entrepreneurship • Faculty Meeting • Consultations • Grading</p><div class="actions"><button class="action" onclick="teach(\'lesson\')"><b>📚 Prepare Lesson</b><br><span class="muted">Improve teaching quality.</span></button><button class="action" onclick="teach(\'class\')"><b>🎓 Teach Class</b><br><span class="muted">Improve learning and engagement.</span></button><button class="action" onclick="teach(\'grade\')"><b>📝 Grade Work</b><br><span class="muted">Improve class accuracy.</span></button><button class="action" onclick="teach(\'mentor\')"><b>🤝 Mentor Student</b><br><span class="muted">Help struggling students.</span></button><button class="action" onclick="teach(\'meeting\')"><b>🏫 Faculty Meeting</b><br><span class="muted">Build professional reputation.</span></button><button class="action" onclick="act(\'rest\')"><b>🌿 Personal Time</b><br><span class="muted">Protect your work-life balance.</span></button></div></div><div class="card"><h2>Recent Events</h2>'+s.log.slice(0,12).map(x=>'<p>'+x+'</p>').join('')+'</div>'}
function eventBox(){if(!s.event)return '';return '<div class="card event"><h2>'+s.event[0]+'</h2><p>'+s.event[1]+'</p>'+s.event[2].map((x,i)=>'<button class="choice" onclick="choose('+i+')">'+x[0]+'</button>').join('')+'</div>'}
function clamp(){s.energy=pct(s.energy);s.morale=pct(s.morale);s.stress=pct(s.stress);s.reputation=pct(s.reputation);s.money=Math.max(0,s.money);Object.keys(s.grades).forEach(k=>s.grades[k]=pct(s.grades[k]))}
function act(t){if(s.event)return;if(t==='class'){s.energy-=6;s.grades.Finance+=3;s.reputation+=2;s.log.unshift('You attended class and participated.')}if(t==='study'){let k=Object.keys(s.grades)[Math.floor(Math.random()*5)];s.energy-=14;s.stress+=3;s.grades[k]+=5;s.log.unshift('You studied '+k+'.')}if(t==='social'){let k=Object.keys(s.relationships)[Math.floor(Math.random()*3)];s.energy-=6;s.morale+=7;s.relationships[k]+=8;s.log.unshift('You spent time with '+k+'.')}if(t==='work'){s.energy-=18;s.money+=150;s.stress+=2;s.log.unshift('You completed a part-time shift and earned ₱150.')}if(t==='club'){s.energy-=10;s.morale+=8;s.reputation+=5;s.log.unshift('You joined a club activity.')}if(t==='rest'){s.energy+=18;s.stress-=8;s.morale+=4;s.log.unshift('You took time to rest.')}clamp();if(Math.random()<.3)s.event=events[Math.floor(Math.random()*events.length)];render()}
function choose(i){let c=s.event[2][i];s.relationships.Anna+=c[1];s.grades.Finance+=c[2];s.energy+=c[3];s.log.unshift(s.event[0]+': '+c[0]);s.event=null;clamp();render()}
function teach(t){let x=s.teacher;if(t==='lesson'){x.teaching+=3;x.knowledge+=1;s.energy-=8;s.log.unshift('You prepared a stronger lesson.')}if(t==='class'){x.average+=2;x.engagement+=3;x.teaching+=2;s.energy-=10;s.stress+=2;s.log.unshift('Your class was taught with a clear learning focus.')}if(t==='grade'){x.average+=1;s.energy-=9;s.stress+=3;s.log.unshift('You graded student work carefully.')}if(t==='mentor'){x.average+=2;x.empathy+=2;s.energy-=7;s.morale+=2;s.log.unshift('You mentored a student who needed extra support.')}if(t==='meeting'){s.reputation+=3;s.energy-=5;s.log.unshift('You contributed at the faculty meeting.')}clamp();render()}
function nextDay(){s.event=null;s.day++;s.energy+=20;s.stress-=5;if(s.day>5){s.day=1;s.week++;s.morale+=3;s.log.unshift('Week '+(s.week-1)+' completed.')}clamp();render();save()}
async function save(){if(!me)return;try{await api('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameState:s})});toast('Game saved online.')}catch(e){toast(e.message)}}
async function loadGame(){try{let x=await api('/api/save');if(x.gameState){s=Object.assign(s,x.gameState)}}catch(e){}}
async function logout(){await api('/api/logout',{method:'POST'});me=null;s.started=false;auth()}
(async()=>{try{let x=await api('/api/me');if(x.user){me=x.user;await load(true);if(s.started)render();else setup()}else auth()}catch(e){auth()}})();
</script></body></html>
