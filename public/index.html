<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Quest | The University Life</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#25232a;font:15px system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1dbd2;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 30px #0000000b}.hero{min-height:88vh;display:flex;align-items:center}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:850;color:#5b50d6;text-transform:uppercase}.hero h1{font-size:clamp(50px,9vw,92px);line-height:.88;margin:12px 0}.hero h2{font-size:28px;margin:0 0 15px}.muted{color:#777}.btn{border:0;border-radius:10px;padding:11px 15px;margin:4px;cursor:pointer;font:inherit;font-weight:750}.btn:hover{transform:translateY(-1px)}.primary{background:#5b50d6;color:white}.soft{background:#ece9ff;color:#4e44ad}.ghost{background:white;border:1px solid #d7d1c8}.danger{background:#fff0f0;color:#a33;border:1px solid #ecc}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.two{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.choice,.action,.mode{border:1px solid #ddd7ce;background:#fff;border-radius:13px;padding:16px;text-align:left;cursor:pointer}.choice:hover,.action:hover,.mode:hover{border-color:#5b50d6;box-shadow:0 4px 14px #5b50d615}.mode{min-height:145px}.mode h3{margin:8px 0}.field{margin:12px 0}.field label{display:block;font-weight:750;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d4cec5;border-radius:9px;font:inherit;background:#fff}.stat{background:#faf9f6;border:1px solid #eee8df;border-radius:12px;padding:13px}.stat b{display:block;font-size:21px;margin-top:2px}.bar{height:6px;background:#e3ded6;border-radius:8px;margin-top:7px;overflow:hidden}.fill{height:100%;background:#5b50d6;border-radius:8px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.pill{display:inline-block;background:#ece9ff;color:#4e44ad;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top h2{margin:5px 0 8px}.event{background:#f0edff;border-color:#dcd7ff}.log p{margin:7px 0}.course{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee8df;padding:10px 0}.course:last-child{border-bottom:0}.mini{font-size:12px}.success{background:#eefaf1;border:1px solid #cdebd3}.warning{background:#fff8e8;border:1px solid #f0dfad}.admin{background:#f7f7fb}.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.nav .btn{margin:0}@media(max-width:760px){.grid,.choices,.two,.actions{grid-template-columns:1fr}.top{display:block}.hero{min-height:80vh}}
</style>
</head>
<body><main class="wrap" id="app"></main>
<script>
(()=>{"use strict";
const app=document.querySelector("#app");
const universities=[
{name:"Eastern Valley State University",type:"Public",desc:"Large public campus with active student organizations and a broad academic community.",tuition:18000},
{name:"Metro Central University",type:"Private",desc:"Urban private university with strong industry-facing opportunities.",tuition:42000},
{name:"St. Aurelia University",type:"Private",desc:"Smaller private university with close student support and campus life.",tuition:36000}
];
const programs=[
["BSBA Financial Management","College of Business",["Finance","Accounting","Economics","Analysis"],["Fundamentals of Accounting","Business Finance","Money and Banking","Financial Markets","Investment Analysis","Risk Management"]],
["BS Accountancy","College of Business",["Accounting","Auditing","Taxation","Analysis"],["Financial Accounting","Management Accounting","Income Taxation","Auditing","Accounting Information Systems","Business Law"]],
["BSBA Marketing Management","College of Business",["Marketing","Communication","Research","Creativity"],["Principles of Marketing","Consumer Behavior","Market Research","Digital Marketing","Sales Management","Strategic Marketing"]],
["BS Computer Science","College of Computing",["Programming","Algorithms","Mathematics","Problem Solving"],["Programming","Data Structures","Algorithms","Database Systems","Operating Systems","Software Engineering"]],
["BS Information Technology","College of Computing",["Technology","Programming","Networks","Systems"],["Programming Fundamentals","Database Management","Networking","Web Development","Systems Administration","IT Project Management"]],
["BS Civil Engineering","College of Engineering",["Mathematics","Design","Engineering","Problem Solving"],["Engineering Drawing","Calculus","Physics","Strength of Materials","Structural Analysis","Engineering Design"]],
["BS Nursing","College of Health Sciences",["Clinical Knowledge","Patient Care","Communication","Medical Knowledge"],["Anatomy and Physiology","Nursing Fundamentals","Pharmacology","Medical-Surgical Nursing","Community Health Nursing","Clinical Practicum"]],
["BS Psychology","College of Arts and Sciences",["Psychology","Research","Communication","Analysis"],["General Psychology","Developmental Psychology","Abnormal Psychology","Research Methods","Social Psychology","Psychological Assessment"]],
["BA Communication","College of Arts and Sciences",["Writing","Media","Communication","Creativity"],["Purposive Communication","Media Studies","Writing for Media","Communication Theory","Broadcasting","Communication Research"]],
["BS Biology","College of Arts and Sciences",["Biology","Research","Laboratory","Science"],["General Biology","Cell Biology","Genetics","Ecology","Biochemistry","Laboratory Research"]],
["BS Hospitality Management","College of Hospitality and Tourism",["Hospitality","Management","Service","Communication"],["Hospitality Operations","Food and Beverage Service","Housekeeping Management","Tourism Fundamentals","Events Management","Hospitality Marketing"]]
].map(x=>({name:x[0],college:x[1],skills:x[2],courses:x[3]}));
const genEd=["Understanding the Self","Purposive Communication","Mathematics in the Modern World","Readings in Philippine History","The Contemporary World","Science, Technology and Society","Ethics","Art Appreciation","Physical Education","Rizal"];
const eventPool=[
["Classmate Needs Help","A classmate asks you to study together.",[["Study together",3,5,-7],["Wish them luck",0,2,0],["Say you are busy",-1,0,0]]],
["Surprise Quiz","Your professor announces a short quiz.",[["Review before class",2,1,-5],["Take it as-is",1,-1,-2],["Skip class",-5,-3,0]]],
["Organization Fair","Student organizations are recruiting.",[["Join a program organization",2,5,-6],["Join a hobby club",1,4,-5],["Rest instead",0,2,5]]],
["Group Project","Your group needs someone to coordinate.",[["Volunteer",3,3,-7],["Help quietly",1,2,-4],["Decline",-2,-1,0]]],
["Unexpected Expense","You need to replace a school supply.",[["Pay immediately",0,0,0],["Borrow from a friend",0,-1,0],["Delay the purchase",-1,-2,0]]]
];
let s=fresh();
function fresh(){return{started:false,mode:"Student Mode",name:"",age:18,pronouns:"She/Her",background:"Middle-income",personality:"Calm",university:null,program:null,year:1,semester:1,week:1,day:1,money:1500,energy:82,morale:72,stress:24,reputation:40,courses:{},skills:{},log:[],event:null,graduated:false,facultyRank:"Instructor",adminRole:"Dean",legacy:[]}}
function clamp(x){return Math.max(0,Math.min(100,Number(x)||0))}
function save(){localStorage.setItem("campusQuest",JSON.stringify(s))}
function load(){try{const x=JSON.parse(localStorage.getItem("campusQuest"));if(x){s=x;return true}}catch(e){}return false}
function btn(t,fn,c="ghost"){const b=document.createElement("button");b.className="btn "+c;b.textContent=t;b.onclick=fn;return b}
function card(){const d=document.createElement("div");d.className="card";return d}
function home(){
app.innerHTML='<section class="hero"><div><div class="eyebrow">University Life Simulation</div><h1>Campus Quest</h1><h2>The University Life</h2><p class="muted" style="max-width:720px">Build a university life from your first day to graduation. Choose a real-world degree, manage academics and money, build relationships, join organizations, and shape the future of your campus.</p><div id="homeBtns"></div><div class="card"><b>Playable prototype</b><p class="muted">Student Mode is fully playable now. Faculty, University Administration, and Legacy Mode have interactive foundations ready for expansion.</p></div></div></section>';
const b=document.querySelector("#homeBtns");
b.append(btn("Start New Game →",create,"primary"),btn("Continue",continueGame,"soft"),btn("Explore University Modes",modes));
}
function modes(){
const p=card();p.innerHTML='<div class="eyebrow">CAMPUS QUEST</div><h1>Choose a Mode</h1><p class="muted">All modes belong to one university world.</p>';
const g=document.createElement("div");g.className="choices";
[["🎓","Student Mode","Create a student, study, work, socialize and graduate.",create],["👩‍🏫","Faculty Mode","Teach classes, grade students, research and advance from Instructor to Professor.",faculty],["🏛️","University Administration","Manage colleges, budgets, programs, faculty workload and student life.",administration],["📚","Legacy Mode","View graduates, achievements and history created by previous playthroughs.",legacy]].forEach(x=>{const b=document.createElement("button");b.className="mode";b.innerHTML="<b>"+x[0]+"</b><h3>"+x[1]+"</h3><p class=muted>"+x[2]+"</p>";b.onclick=x[3];g.append(b)});
p.append(g,btn("← Home",home));app.replaceChildren(p)
}
function create(){s=fresh();character()}
function character(){
const p=card();p.innerHTML='<div class="eyebrow">STUDENT MODE · STEP 1 OF 3</div><h1>Create Your Student</h1>'+field("Name","name","text","")+field("Age","age","number","18")+'<div class="field"><label>Pronouns</label><select id="pronouns"><option>She/Her</option><option>He/Him</option><option>They/Them</option></select></div><div class="field"><label>Financial Background</label><select id="background"><option>Low-income</option><option>Lower-middle income</option><option selected>Middle-income</option><option>Upper-middle income</option><option>Wealthy</option><option>Working student</option><option>Scholarship student</option></select></div><div class="field"><label>Personality</label><select id="personality"><option>Calm</option><option>Ambitious</option><option>Introverted</option><option>Extroverted</option><option>Competitive</option><option>Friendly</option><option>Independent</option><option>Disciplined</option><option>Creative</option></select></div>';
p.append(btn("Next: University →",characterNext,"primary"),btn("Back",home));app.replaceChildren(p)
}
function field(l,id,type,v){return '<div class="field"><label>'+l+'</label><input id="'+id+'" type="'+type+'" value="'+v+'"></div>'}
function characterNext(){s.name=document.querySelector("#name").value.trim()||"Alex";s.age=Number(document.querySelector("#age").value)||18;s.pronouns=document.querySelector("#pronouns").value;s.background=document.querySelector("#background").value;s.personality=document.querySelector("#personality").value;university()}
function university(){
const p=card();p.innerHTML='<div class="eyebrow">STUDENT MODE · STEP 2 OF 3</div><h1>Choose Your University</h1><p class="muted">Fictional universities keep the simulation distinct from real institutions.</p>';
const g=document.createElement("div");g.className="choices";universities.forEach(u=>{const b=document.createElement("button");b.className="choice";b.innerHTML='<span class="pill">'+u.type+'</span><h3>'+u.name+'</h3><p>'+u.desc+'</p><small>Representative annual tuition: ₱'+u.tuition.toLocaleString()+'</small>';b.onclick=()=>{s.university=u;program()};g.append(b)});p.append(g,btn("← Back",character));app.replaceChildren(p)
}
function program(){
const p=card();p.innerHTML='<div class="eyebrow">STUDENT MODE · STEP 3 OF 3</div><h1>Choose Your Program</h1><p class="muted">These are real-world degree names. The curriculum shown is representative and can vary by university.</p>';
const g=document.createElement("div");g.className="choices";programs.forEach(x=>{const b=document.createElement("button");b.className="choice";b.innerHTML='<span class="pill">'+x.college+'</span><h3>'+x.name+'</h3><p>'+x.skills.join(" · ")+'</p><small>Example courses: '+x.courses.slice(0,3).join(" · ")+'</small>';b.onclick=()=>{s.program=x;begin()};g.append(b)});p.append(g,btn("← Back",university));app.replaceChildren(p)
}
function begin(){s.started=true;s.program.courses.forEach(c=>s.courses[c]=65);s.program.skills.forEach(x=>s.skills[x]=45);s.money=s.background==="Low-income"?900:s.background==="Working student"?1100:s.background==="Wealthy"?3500:1500;s.log=["Orientation day at "+s.university.name+".","Enrolled in "+s.program.name+"."];curriculum()}
function curriculum(){
const p=card();p.innerHTML='<div class="eyebrow">YOUR ACADEMIC PATH</div><h1>'+s.program.name+'</h1><p><b>'+s.university.name+'</b> · '+s.program.college+'</p><div class="two"><div><h3>General Education</h3><p>'+genEd.join(" · ")+'</p><h3>Program Courses</h3>'+s.program.courses.map(c=>'<div class="course"><span>'+c+'</span><span class="pill">65</span></div>').join("")+'</div><div><div class="card"><h3>Starting Profile</h3><p>Year 1 · Semester 1</p><p>₱'+s.money.toLocaleString()+' · Energy 82 · Morale 72 · Stress 24</p></div><div class="card"><h3>First Goal</h3><p>Attend your first class, build a routine, and survive your first week.</p></div></div></div>';
p.append(btn("Begin First Day →",()=>{save();dashboard()},"primary"),btn("Save & Return Home",()=>{save();home()}));app.replaceChildren(p)
}
function stat(n,v,max=100,money=false){const d=document.createElement("div");d.className="stat";d.innerHTML="<span>"+n+"</span><b>"+(money?"₱"+Math.round(v).toLocaleString():Math.round(v))+"</b><div class=bar><div class=fill></div></div>";d.querySelector(".fill").style.width=Math.max(0,Math.min(100,v/max*100))+"%";return d}
function dashboard(){
if(s.graduated){graduation();return}
const p=card(),top=document.createElement("div");top.className="top";top.innerHTML='<div><div class="eyebrow">STUDENT MODE</div><h2>'+s.name+'</h2><span class="pill">'+s.program.name+'</span></div>';const nav=document.createElement("div");nav.append(btn("Save",save,"soft"),btn("Curriculum",()=>curriculum()),btn("Modes",modes),btn("End Day",nextDay,"primary"));top.append(nav);p.append(top);
const stats=document.createElement("div");stats.className="grid";const avg=Object.values(s.courses).reduce((a,b)=>a+b,0)/Object.keys(s.courses).length;[["Energy",s.energy],["Morale",s.morale],["Stress",s.stress],["Reputation",s.reputation],["Academic Avg",avg],["Money",s.money,3000,true]].forEach(x=>stats.append(stat(x[0],x[1],x[2]||100,x[3])));p.append(stats);
const two=document.createElement("div");two.className="two";const main=document.createElement("div");const d=card();const weekdays=["Monday","Tuesday","Wednesday","Thursday","Friday"];const course=s.program.courses[(s.day-1)%s.program.courses.length];d.innerHTML="<h2>"+weekdays[(s.day-1)%5]+" · Week "+s.week+"</h2><p class=muted>Year "+s.year+" · Semester "+s.semester+" · Day "+s.day+"</p><h3>Today's Class</h3><p><b>"+course+"</b> · 8:00 AM</p>";const acts=document.createElement("div");acts.className="actions";
[["📖 Attend Class","class"],["📝 Study","study"],["👥 Socialize","social"],["💼 Part-time Work","work"],["🎭 Campus Activity","club"],["🛏️ Rest","rest"]].forEach(a=>{const b=document.createElement("button");b.className="action";b.innerHTML="<b>"+a[0]+"</b><br><small class=muted>Take action</small>";b.onclick=()=>act(a[1]);acts.append(b)});d.append(acts);main.append(d);if(s.event)main.append(eventCard());
const side=document.createElement("aside"),sk=card();sk.innerHTML="<h3>Program Skills</h3>"+Object.entries(s.skills).map(x=>"<p><b>"+x[0]+"</b>: "+Math.round(x[1])+"</p>").join("");side.append(sk);const uni=card();uni.innerHTML="<h3>Campus</h3><p><b>"+s.university.name+"</b></p><p class=muted>"+s.university.desc+"</p><p>Library · Cafeteria · Student Center · Gym · Administration Building</p>";side.append(uni);two.append(main,side);p.append(two);
const log=card();log.innerHTML="<h3>Recent Life</h3>"+s.log.slice(0,9).map(x=>"<p>• "+x+"</p>").join("");p.append(log);app.replaceChildren(p)
}
function eventCard(){const p=card();p.className+=" event";const e=s.event;p.innerHTML="<b>EVENT</b><h3>"+e[0]+"</h3><p>"+e[1]+"</p>";e[2].forEach((x,i)=>p.append(btn(x[0],()=>choose(i))));return p}
function act(t){
const c=s.program.courses[(s.day-1)%s.program.courses.length];
if(t==="class"){s.energy-=8;s.stress+=4;s.courses[c]=clamp(s.courses[c]+3);s.reputation+=1;s.log.unshift("Attended "+c+".")}
if(t==="study"){s.energy-=10;s.stress+=6;s.courses[c]=clamp(s.courses[c]+5);s.skills[s.program.skills[0]]=clamp(s.skills[s.program.skills[0]]+2);s.log.unshift("Studied "+c+".")}
if(t==="social"){s.energy-=5;s.morale+=7;s.stress-=3;s.reputation+=1;s.log.unshift("Spent time with classmates.")}
if(t==="work"){s.energy-=14;s.stress+=7;s.money+=150;s.log.unshift("Worked a part-time shift and earned ₱150.")}
if(t==="club"){s.energy-=7;s.morale+=4;s.reputation+=4;s.log.unshift("Joined a campus activity.")}
if(t==="rest"){s.energy+=18;s.stress-=10;s.morale+=3;s.log.unshift("Rested and recovered.")}
s.energy=clamp(s.energy);s.morale=clamp(s.morale);s.stress=clamp(s.stress);s.reputation=clamp(s.reputation);if(Math.random()<.34)s.event=eventPool[Math.floor(Math.random()*eventPool.length)];save();dashboard()
}
function choose(i){const c=s.event[2][i];s.reputation=clamp(s.reputation+c[1]);s.morale=clamp(s.morale+c[2]);s.energy=clamp(s.energy+c[3]);if(s.event[0]==="Unexpected Expense"&&i===0)s.money=Math.max(0,s.money-120);s.log.unshift(s.event[0]+": "+c[0]);s.event=null;save();dashboard()}
function nextDay(){
s.day++;s.energy=clamp(s.energy-3);s.stress=clamp(s.stress-3);s.morale=clamp(s.morale+2);
if(s.day>5){s.day=1;s.week++;s.money=Math.max(0,s.money-250);s.log.unshift("New university week. Living expenses: ₱250.")}
if(s.week>16){s.week=1;s.semester++;s.log.unshift("Semester completed.");const avg=Object.values(s.courses).reduce((a,b)=>a+b,0)/Object.keys(s.courses).length;if(avg>=75)s.log.unshift("You met the academic benchmark for the semester.");else{s.stress=clamp(s.stress+10);s.log.unshift("Your grades need attention next semester.")}if(s.semester>2){s.semester=1;s.year++;s.log.unshift("A new academic year begins.")}}
if(s.year>=4&&s.semester===2&&s.week===16){s.graduated=true;s.legacy.push({name:s.name,degree:s.program.name,year:new Date().getFullYear(),reputation:s.reputation});}
if(Math.random()<.55)s.event=eventPool[Math.floor(Math.random()*eventPool.length)];save();dashboard()
}
function graduation(){
const p=card();p.className+=" success";p.innerHTML='<div class="eyebrow">GRADUATION</div><h1>Congratulations, '+s.name+'!</h1><p>You completed the simulated university journey in <b>'+s.program.name+'</b> at <b>'+s.university.name+'</b>.</p><div class="grid"><div class="stat"><span>Academic Average</span><b>'+Math.round(Object.values(s.courses).reduce((a,b)=>a+b,0)/Object.keys(s.courses).length)+'</b></div><div class="stat"><span>Reputation</span><b>'+Math.round(s.reputation)+'</b></div><div class="stat"><span>Final Money</span><b>₱'+Math.round(s.money).toLocaleString()+'</b></div></div><p>Your character can now become part of Legacy Mode.</p>';p.append(btn("View Legacy",legacy,"primary"),btn("New Student",create,"soft"),btn("Home",home));app.replaceChildren(p)
}
function faculty(){
const p=card();p.innerHTML='<div class="eyebrow">FACULTY MODE</div><h1>Faculty Career</h1><p class="muted">Teach, grade, mentor, research and progress through the academic hierarchy.</p><div class="two"><div><div class="card"><h3>'+s.facultyRank+'</h3><p>Career path: Instructor → Assistant Professor → Associate Professor → Professor → Department Chair → Dean → Vice President → President</p><p>Teaching skill: 62 · Knowledge: 70 · Communication: 64 · Research: 48</p></div><div class="actions"><button class="action" onclick="facultyAction('teach')"><b>📚 Teach Class</b><br><small>Gain teaching experience</small></button><button class="action" onclick="facultyAction('grade')"><b>📝 Grade Papers</b><br><small>Support students</small></button><button class="action" onclick="facultyAction('mentor')"><b>🤝 Mentor Student</b><br><small>Build academic relationships</small></button><button class="action" onclick="facultyAction('research')"><b>🔬 Research</b><br><small>Build research reputation</small></button></div></div><div class="card"><h3>Faculty Life</h3><p>Courses assigned · Student advising · Faculty meetings · Research · Service</p><p class=muted>Faculty gameplay shares the same university-world concept as Student Mode.</p></div></div>';
p.append(btn("University Administration",administration,"soft"),btn("← Modes",modes));app.replaceChildren(p)
}
window.facultyAction=function(a){s.log.unshift("Faculty action: "+a+".");faculty()}
function administration(){
const p=card();p.className+=" admin";p.innerHTML='<div class="eyebrow">UNIVERSITY ADMINISTRATION</div><h1>University Leadership</h1><p class="muted">No Principal Mode. This is a university hierarchy with President, Vice Presidents, Deans, Chairs and Program Coordinators.</p>';
const roles=[["President","University-wide strategy, mission, major decisions"],["VP for Academic Affairs","Programs, curriculum, faculty development, academic quality"],["VP for Administration","HR, facilities, procurement, campus operations"],["VP for Finance","Budget, revenue, expenditures, scholarships"],["VP for Research","Research centers, grants, publications, partnerships"],["VP for Student Affairs","Student welfare, organizations, activities, discipline"],["Dean","College programs, faculty, budget, student performance"],["Department Chair","Faculty assignments, schedules, workload, department activities"],["Program Coordinator","Curriculum, advising, program activities, accreditation documentation"]];
const g=document.createElement("div");g.className="choices";roles.forEach(r=>{const d=document.createElement("div");d.className="choice";d.innerHTML="<span class=pill>University Hierarchy</span><h3>"+r[0]+"</h3><p class=muted>"+r[1]+"</p>";g.append(d)});p.append(g);
const h=card();h.innerHTML="<h3>Example University Structure</h3><p><b>University</b> → College of Business → Department of Finance → BSBA Financial Management → Program Coordinator → Faculty → Students</p><p class=muted>A future event can travel upward through the same world: student issue → department → dean → vice president → president.</p>";p.append(h,btn("Faculty Mode",faculty,"soft"),btn("← Modes",modes));app.replaceChildren(p)
}
function legacy(){
const p=card();p.innerHTML='<div class="eyebrow">LEGACY MODE</div><h1>University History</h1><p class="muted">Completed characters become part of the university's history.</p>';
if(s.legacy.length===0)p.innerHTML+='<div class="card warning"><b>No graduates yet.</b><p>Finish a student journey to create your first legacy record.</p></div>';else s.legacy.forEach(x=>p.innerHTML+='<div class="card"><h3>'+x.name+'</h3><p>'+x.degree+' · Graduation year '+x.year+'</p><p>Reputation: '+Math.round(x.reputation)+'</p></div>');
p.append(btn("← Modes",modes),btn("Home",home));app.replaceChildren(p)
}
function continueGame(){if(load()&&s.started){if(s.graduated)graduation();else dashboard()}else create()}
window.addEventListener("error",e=>{app.innerHTML="";const p=card();p.innerHTML="<div class=eyebrow>Campus Quest</div><h1>Game Error</h1><p>"+(e.message||"Unknown error")+"</p>";p.append(btn("Reload",()=>location.reload(),"primary"));app.append(p)});
home();
})();
</script>
</body>
</html>
