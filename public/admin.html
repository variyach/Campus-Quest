<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Quest Admin</title><style>body{font-family:system-ui;margin:0;background:#f5f3ef;color:#252525}.wrap{max-width:1000px;margin:auto;padding:30px}.card{background:#fff;border:1px solid #e5e1da;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 10px 30px #0000000b}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #ddd}button{cursor:pointer;background:#6d5dfc;color:#fff;border:0;font-weight:700}.danger{background:#b84a4a}.muted{color:#777}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid #eee}.hidden{display:none}</style></head><body><div class="wrap"><h1>Campus Quest Admin</h1><p class="muted">Administrator control center.</p><div id="login" class="card"><h2>Administrator Login</h2><input id="u" placeholder="Admin username"><input id="p" type="password" placeholder="Admin password"><button onclick="login()">Sign in</button><p id="err"></p><p class="muted">Set ADMIN_USER and ADMIN_PASSWORD in your hosting environment.</p></div><div id="dash" class="hidden"><div class="card"><h2>School Control</h2><p>View registered players, reset saves, or remove accounts.</p><button onclick="load()">Refresh</button> <button onclick="logout()">Log out</button></div><div class="card"><h2>Players</h2><div id="players">Loading...</div></div></div></div><script>async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function login(){try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');load()}catch(e){err.textContent=e.message}}async function load(){try{let x=await api('/api/admin/users');players.innerHTML=x.users.length?x.users.map(a=>'<div class="row"><div><b>'+a.username+'</b><div class="muted">'+a.role+' · '+(a.hasSave?'saved game':'no save')+'</div></div>'+(a.role==='player'?'<div><button onclick="reset(\''+a.id+'\')">Reset Save</button> <button class="danger" onclick="del(\''+a.id+'\')">Delete</button></div>':'')+'</div>').join(''):'No registered players yet.'}catch(e){err.textContent=e.message}}async function reset(id){if(confirm('Reset this player save?')){await api('/api/admin/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});load()}}async function del(id){if(confirm('Delete this player permanently?')){await api('/api/admin/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});load()}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}api('/api/me').then(x=>{if(x.user&&x.user.role==='admin'){login.classList.add('hidden');dash.classList.remove('hidden');load()}})</script></body></html>
